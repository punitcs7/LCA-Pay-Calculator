<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCA Pay Calculator - Premium Edition</title>
    <style>
        :root {
            /* Light Mode Colors */
            --bg-color-1: #e0c3fc;
            --bg-color-2: #8ec5fc;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --blue: #0071e3;
            --blue-hover: #0077ed;
            --green: #34c759; /* Apple system green */
            --btn-sec: rgba(0, 0, 0, 0.05);
            --btn-sec-hover: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.7);
            --divider: rgba(0, 0, 0, 0.1);
        }

        /* Auto-switches to Dark Mode if your device is in Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color-1: #1a0b2e;
                --bg-color-2: #3b2a5c;
                --card-bg: rgba(30, 30, 30, 0.5);
                --card-border: rgba(255, 255, 255, 0.1);
                --text-main: #f5f5f7;
                --text-sub: #a1a1a6;
                --blue: #0A84FF;
                --blue-hover: #409CFF;
                --green: #30d158; /* Apple dark mode green */
                --btn-sec: rgba(255, 255, 255, 0.1);
                --btn-sec-hover: rgba(255, 255, 255, 0.15);
                --input-bg: rgba(0, 0, 0, 0.4);
                --divider: rgba(255, 255, 255, 0.15);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-1));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .calculator-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.4);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            transform: scale(0.9);
            opacity: 0;
            animation: cardEnter 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes cardEnter {
            to { transform: scale(1); opacity: 1; }
        }

        h2 {
            text-align: center;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.5px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .constants-info {
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 32px;
            font-weight: 500;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 16px 20px;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            font-size: 20px;
            font-weight: 500;
            box-sizing: border-box;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2);
            transform: translateY(-2px);
        }

        .button-group {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
        }

        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        button:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background-color: var(--blue);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--blue-hover);
            box-shadow: 0 6px 16px rgba(0, 113, 227, 0.3);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--btn-sec);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--btn-sec-hover);
        }

        .results {
            border-top: 1px solid var(--divider);
            padding-top: 24px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            align-items: center;
            opacity: 0;
            transform: translateY(15px);
        }

        .animate-up {
            animation: slideUpFade 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.15s; }
        .delay-3 { animation-delay: 0.25s; }
        .delay-4 { animation-delay: 0.35s; }
        .delay-5 { animation-delay: 0.45s; }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .result-title {
            font-weight: 500;
            font-size: 15px;
        }

        .calc-math {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .result-amount {
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s;
        }

        .pulse {
            animation: pulseNumber 0.4s ease-out;
        }

        @keyframes pulseNumber {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); color: var(--blue); }
            100% { transform: scale(1); }
        }

        .result-row.sub-total {
            border-top: 1px dashed var(--divider);
            padding-top: 16px;
            margin-top: 16px;
        }
        
        .sub-total .result-title {
            font-weight: 600;
        }

        .result-row.grand-total {
            border-top: 1px solid var(--divider);
            padding-top: 20px;
            margin-top: 20px;
            margin-bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
        }

        .grand-total .result-title {
            font-weight: 700;
            font-size: 18px;
        }

        .grand-total .result-amount {
            font-weight: 700;
            font-size: 24px;
            color: var(--green); /* Bright green for final take-home pay */
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Pay Calculator</h2>
        
        <div class="constants-info">
            LCA = $3,542 • Rate = $31.25/hr • Employer = 10%<br>
            LCA After Taxes = $2,859
        </div>

        <div class="input-group">
            <label for="hoursWorked">Hours Worked</label>
            <input type="number" id="hoursWorked" placeholder="0" step="0.5" min="0" onkeypress="handleEnter(event)">
        </div>

        <div class="button-group">
            <button onclick="calculatePay()" class="btn-primary">Calculate</button>
            <button onclick="clearCalculator()" class="btn-secondary">Clear</button>
        </div>

        <div class="results" id="resultsContainer">
            <div class="result-row delay-1" id="row1">
                <div class="title-group">
                    <span class="result-title">Pay for hours worked</span>
                    <span id="calcPayForHours" class="calc-math"></span>
                </div>
                <span id="resPayForHours" class="result-amount">$0.00</span>
            </div>
            <div class="result-row delay-2" id="row2">
                <div class="title-group">
                    <span class="result-title">Amount after LCA</span>
                    <span id="calcAmountAfterLCA" class="calc-math"></span>
                </div>
                <span id="resAmountAfterLCA" class="result-amount">$0.00</span>
            </div>
            <div class="result-row delay-3" id="row3">
                <div class="title-group">
                    <span class="result-title">10% Employer cut</span>
                    <span id="calcEmployerCut" class="calc-math"></span>
                </div>
                <span id="resEmployerCut" class="result-amount">$0.00</span>
            </div>
            <div class="result-row sub-total delay-4" id="row4">
                <div class="title-group">
                    <span class="result-title">Total Deduction</span>
                    <span id="calcFinalTotal" class="calc-math"></span>
                </div>
                <span id="resFinalTotal" class="result-amount">$0.00</span>
            </div>
            <div class="result-row grand-total delay-5" id="row5">
                <div class="title-group">
                    <span class="result-title">Final Take-Home Pay</span>
                    <span id="calcTakeHome" class="calc-math"></span>
                </div>
                <span id="resTakeHome" class="result-amount">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        window.onload = () => { triggerCascade(); };

        function handleEnter(e) {
            if(e.key === 'Enter') {
                calculatePay();
            }
        }

        function calculatePay() {
            let hoursInput = document.getElementById('hoursWorked').value;
            let hours = parseFloat(hoursInput);

            if (isNaN(hours)) { hours = 0; }

            const lcaAmount = 3542.00;
            const payRate = 31.25;
            const percentage = 0.10;
            const lcaAfterTaxes = 2859.00;

            const payForHours = payRate * hours;
            const amountAfterLca = lcaAmount - payForHours;
            const employerCut = amountAfterLca * percentage;
            const totalDeduction = amountAfterLca + employerCut;
            
            // New calculation for final take-home pay
            const finalTakeHome = lcaAfterTaxes - totalDeduction;

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency', currency: 'USD'
                }).format(amount);
            };

            // Update amounts
            document.getElementById('resPayForHours').innerText = formatCurrency(payForHours);
            document.getElementById('resAmountAfterLCA').innerText = formatCurrency(amountAfterLca);
            document.getElementById('resEmployerCut').innerText = formatCurrency(employerCut);
            document.getElementById('resFinalTotal').innerText = formatCurrency(totalDeduction);
            document.getElementById('resTakeHome').innerText = formatCurrency(finalTakeHome);

            // Update math text
            if (hours > 0) {
                document.getElementById('calcPayForHours').innerText = `(${formatCurrency(payRate)} × ${hours} hrs)`;
                document.getElementById('calcAmountAfterLCA').innerText = `(${formatCurrency(lcaAmount)} - ${formatCurrency(payForHours)})`;
                document.getElementById('calcEmployerCut').innerText = `(${formatCurrency(amountAfterLca)} × 10%)`;
                document.getElementById('calcFinalTotal').innerText = `(${formatCurrency(amountAfterLca)} + ${formatCurrency(employerCut)})`;
                document.getElementById('calcTakeHome').innerText = `(${formatCurrency(lcaAfterTaxes)} - ${formatCurrency(totalDeduction)})`;
            } else {
                clearMathText();
            }

            triggerCascade();
            triggerPulse();
        }

        function clearCalculator() {
            document.getElementById('hoursWorked').value = '';
            document.getElementById('resPayForHours').innerText = '$0.00';
            document.getElementById('resAmountAfterLCA').innerText = '$0.00';
            document.getElementById('resEmployerCut').innerText = '$0.00';
            document.getElementById('resFinalTotal').innerText = '$0.00';
            document.getElementById('resTakeHome').innerText = '$0.00';
            clearMathText();
            triggerCascade();
        }

        function clearMathText() {
            document.getElementById('calcPayForHours').innerText = '';
            document.getElementById('calcAmountAfterLCA').innerText = '';
            document.getElementById('calcEmployerCut').innerText = '';
            document.getElementById('calcFinalTotal').innerText = '';
            document.getElementById('calcTakeHome').innerText = '';
        }

        function triggerCascade() {
            const rows = ['row1', 'row2', 'row3', 'row4', 'row5'];
            rows.forEach(id => {
                let element = document.getElementById(id);
                element.classList.remove('animate-up');
                void element.offsetWidth; 
                element.classList.add('animate-up');
            });
        }

        function triggerPulse() {
            const amounts = ['resPayForHours', 'resAmountAfterLCA', 'resEmployerCut', 'resFinalTotal', 'resTakeHome'];
            amounts.forEach(id => {
                let element = document.getElementById(id);
                element.classList.remove('pulse');
                void element.offsetWidth; 
                element.classList.add('pulse');
            });
        }
    </script>

</body>
</html>
